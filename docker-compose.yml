# Local Postgres for development and integration tests.
# Port 55433 avoids other local projects' databases.
services:
  db:
    image: postgres:16-alpine
    container_name: prospector-db
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector
      POSTGRES_DB: prospector
    ports:
      - "55433:5432"
    volumes:
      - prospector-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  prospector-db:
