# The box: web, worker, database and HTTPS. Images are built locally and loaded here,
# so nothing is compiled on the server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: prospector
    volumes:
      - db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: prospector:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    image: prospector:latest
    restart: unless-stopped
    env_file: .env.production
    command: ["npx", "tsx", "src/worker.ts"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The Caddyfile reads {$APP_DOMAIN} from this container's own environment: without it
    # the site address is empty and Caddy parses the file as a global options block.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  db:
  caddy-data:
  caddy-config:
